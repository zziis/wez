<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث وصل</title>
<style>body{font-family:system-ui;background:#11151a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.c{background:#20262d;padding:28px;border-radius:22px;text-align:center;max-width:420px}b{color:#29d3f5}</style></head>
<body><div class="c"><h2>تحديث وَصِل</h2><p id="s">جارٍ حذف النسخة القديمة وتحميل <b>V2.3</b>…</p></div>
<script>
(async()=>{
 try{
  if('caches' in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('wasil-')).map(k=>caches.delete(k)))}
  if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
  localStorage.setItem('wasil_boot_version','2.3.0');
 }catch(e){}
 setTimeout(()=>location.replace('./?v=2.3.0'),350);
})();
</script></body></html>
